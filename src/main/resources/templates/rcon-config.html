<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RCON Palworld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white">
    <div class="container-fluid page-shell">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Palworld Admin</a>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">Volver</a>
    </div>
</nav>
<main class="container-fluid page-shell py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h1 class="h3 mb-1">Configuracion RCON</h1>
            <div class="text-secondary" th:text="${server.name}"></div>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/}">Dashboard</a>
    </div>

    <form class="bg-white border rounded-2 p-4" th:action="@{/servers/{id}/rcon(id=${server.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="row g-3">
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rconEnabled" name="rconEnabled" value="true" th:checked="${server.rconEnabled}">
                    <label class="form-check-label" for="rconEnabled">RCON activo para este servidor</label>
                </div>
            </div>
            <div class="col-md-5">
                <label class="form-label" for="rconHost">IP / host</label>
                <input class="form-control" id="rconHost" name="rconHost" th:value="${server.rconHost ?: '127.0.0.1'}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="rconPort">Puerto</label>
                <input class="form-control" id="rconPort" type="number" min="1" max="65535" name="rconPort" th:value="${server.rconPort ?: 25575}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="rconPassword">Password</label>
                <input class="form-control" id="rconPassword" type="password" name="rconPassword"
                       th:placeholder="${#strings.isEmpty(server.rconPassword) ? 'Password RCON' : 'Guardado; deja vacio para conservar'}">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit">Guardar RCON</button>
            <a class="btn btn-outline-secondary" th:href="@{/}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
