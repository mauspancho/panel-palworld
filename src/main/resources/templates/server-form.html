<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servidor Palworld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white">
    <div class="container-fluid page-shell">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Palworld Admin</a>
    </div>
</nav>
<main class="container-fluid page-shell py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0" th:text="${server.id == null ? 'Registrar servidor' : 'Editar servidor'}"></h1>
        <a class="btn btn-outline-secondary" th:href="@{/}">Volver</a>
    </div>

    <form class="bg-white border rounded-2 p-4" th:action="@{/servers}" th:object="${server}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="name">Nombre visible</label>
                <input class="form-control" id="name" th:field="*{name}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label" for="type">Tipo</label>
                <select class="form-select" id="type" th:field="*{type}">
                    <option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option>
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <div class="form-check">
                    <input type="hidden" name="_enabled" value="on">
                    <input class="form-check-input" id="enabled" type="checkbox" th:field="*{enabled}">
                    <label class="form-check-label" for="enabled">Activo en el panel</label>
                </div>
            </div>
            <div class="col-md-6 server-field docker-field">
                <label class="form-label" for="containerName">Contenedor Docker</label>
                <input class="form-control" id="containerName" th:field="*{containerName}">
            </div>
            <div class="col-md-6 server-field docker-field">
                <label class="form-label" for="composeProjectName">Docker Compose/project</label>
                <input class="form-control" id="composeProjectName" th:field="*{composeProjectName}">
            </div>
            <div class="col-md-6 server-field systemd-field">
                <label class="form-label" for="serviceName">Servicio Linux/systemd</label>
                <input class="form-control" id="serviceName" th:field="*{serviceName}" placeholder="palworld.service">
            </div>
            <div class="col-12">
                <label class="form-label" for="rootPath">Ruta raíz del servidor</label>
                <input class="form-control" id="rootPath" th:field="*{rootPath}" placeholder="/opt/palworld-servers/server01" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="steamcmdPath">Ruta SteamCMD</label>
                <input class="form-control" id="steamcmdPath" th:field="*{steamcmdPath}" placeholder="/usr/games/steamcmd" required>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="linuxUser">Usuario Linux</label>
                <input class="form-control" id="linuxUser" th:field="*{linuxUser}" placeholder="palworld">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="linuxGroup">Grupo Linux</label>
                <input class="form-control" id="linuxGroup" th:field="*{linuxGroup}" placeholder="palworld">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="publicPort">Puerto público</label>
                <input class="form-control" id="publicPort" type="number" min="1" max="65535" th:field="*{publicPort}" placeholder="8211">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="updateCommand">Comando update Docker permitido</label>
                <input class="form-control" id="updateCommand" th:field="*{updateCommand}" placeholder="docker exec contenedor /ruta/update.sh">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/}">Cancelar</a>
        </div>
    </form>

    <form th:if="${server.id != null}" class="mt-3" th:action="@{/servers/{id}/delete(id=${server.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-outline-danger" onclick="return confirm('¿Eliminar este servidor del panel?')">Eliminar del panel</button>
    </form>

    <form th:if="${server.id != null}" class="mt-3" th:action="@{/servers/{id}/install(id=${server.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-warning" onclick="return confirm('Esto instalara o levantara el servidor usando los campos registrados. ¿Continuar?')">Instalar/crear servidor</button>
    </form>

    <section th:if="${paths != null}" class="mt-4">
        <h2 class="h5">Rutas detectadas</h2>
        <div class="bg-white border rounded-2 overflow-hidden">
            <table class="table mb-0">
                <tbody>
                <tr><th>Raíz</th><td th:text="${paths.paths.root}"></td><td th:text="${paths.rootExists ? 'Existe' : 'No existe'}"></td></tr>
                <tr><th>Configuración</th><td th:text="${paths.paths.settingsFile}"></td><td th:text="${paths.settingsExists ? 'Existe' : 'No existe'}"></td></tr>
                <tr><th>Default</th><td th:text="${paths.paths.defaultSettingsFile}"></td><td th:text="${paths.defaultSettingsExists ? 'Existe' : 'No existe'}"></td></tr>
                <tr><th>Guardados</th><td th:text="${paths.paths.saveGamesRoot}"></td><td th:text="${paths.saveGamesExists ? 'Existe' : 'No existe'}"></td></tr>
                </tbody>
            </table>
        </div>
        <div th:if="${!paths.settingsExists}" class="alert alert-warning mt-3">
            PalWorldSettings.ini normalmente se genera después de iniciar el servidor por primera vez.
        </div>
    </section>
</main>
<script>
    function toggleTypeFields() {
        const type = document.getElementById('type').value;
        document.querySelectorAll('.docker-field').forEach(el => el.style.display = type === 'DOCKER' ? '' : 'none');
        document.querySelectorAll('.systemd-field').forEach(el => el.style.display = type === 'SYSTEMD' ? '' : 'none');
    }
    document.getElementById('type').addEventListener('change', toggleTypeFields);
    toggleTypeFields();
</script>
</body>
</html>
