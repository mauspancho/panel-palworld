<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs Palworld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white">
    <div class="container-fluid page-shell">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Palworld Admin</a>
    </div>
</nav>
<main class="container-fluid page-shell py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0" th:text="'Logs - ' + ${server.name}"></h1>
        <div class="d-flex gap-2">
            <form th:action="@{/servers/{id}/logs(id=${server.id})}" method="get" class="d-flex gap-2">
                <input class="form-control" style="width: 110px" type="number" name="lines" min="1" max="1000" th:value="${lines}">
                <button class="btn btn-primary">Refrescar</button>
            </form>
            <a class="btn btn-outline-secondary" th:href="@{/}">Volver</a>
        </div>
    </div>
    <h2 class="h5">Servidor</h2>
    <pre class="bg-dark text-light rounded-2 p-3 log-output" th:text="${serverLogs}"></pre>

    <h2 class="h5 mt-4">Panel</h2>
    <div class="bg-white border rounded-2 overflow-hidden">
        <table class="table table-sm mb-0">
            <thead class="table-light">
            <tr><th>Inicio</th><th>Fin</th><th>Acción</th><th>Estado</th><th>Mensaje</th><th>Error</th></tr>
            </thead>
            <tbody>
            <tr th:if="${internalLogs.isEmpty()}"><td colspan="6" class="text-center text-secondary py-4">Sin logs internos.</td></tr>
            <tr th:each="log : ${internalLogs}">
                <td th:text="${#temporals.format(log.startedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${log.finishedAt == null ? '' : #temporals.format(log.finishedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${log.action}"></td>
                <td th:text="${log.status}"></td>
                <td th:text="${log.message}"></td>
                <td class="small text-danger" th:text="${log.error}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
