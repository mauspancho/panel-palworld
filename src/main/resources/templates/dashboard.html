<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palworld Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white">
    <div class="container-fluid page-shell">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Palworld Admin</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary btn-sm">Salir</button>
        </form>
    </div>
</nav>
<main class="container-fluid page-shell py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0">Servidores</h1>
        <a class="btn btn-primary" th:href="@{/servers/new}">Registrar servidor</a>
    </div>

    <div class="bg-white border rounded-2 overflow-hidden">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Contenedor / servicio</th>
                <th>Ruta raíz</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${rows.isEmpty()}">
                <td colspan="6" class="text-center text-secondary py-5">No hay servidores registrados.</td>
            </tr>
            <tr th:each="row : ${rows}">
                <td>
                    <a class="fw-semibold text-decoration-none" th:href="@{/servers/{id}/edit(id=${row.server.id})}" th:text="${row.server.name}"></a>
                </td>
                <td><span class="badge text-bg-secondary" th:text="${row.server.type}"></span></td>
                <td th:text="${row.server.type.name() == 'DOCKER' ? row.server.containerName : row.server.serviceName}"></td>
                <td class="small text-secondary" th:text="${row.server.rootPath}"></td>
                <td>
                    <span class="badge status-pill"
                          th:classappend="${row.status.name() == 'RUNNING'} ? ' text-bg-success' : (${row.status.name() == 'STOPPED'} ? ' text-bg-secondary' : (${row.status.name() == 'ERROR'} ? ' text-bg-danger' : ' text-bg-warning'))"
                          th:text="${row.status.label}"></span>
                </td>
                <td>
                    <div class="d-flex flex-wrap gap-1 justify-content-end">
                        <form th:action="@{/servers/{id}/start(id=${row.server.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-success">Iniciar</button>
                        </form>
                        <form th:action="@{/servers/{id}/stop(id=${row.server.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger">Detener</button>
                        </form>
                        <form th:action="@{/servers/{id}/restart(id=${row.server.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-primary">Reiniciar</button>
                        </form>
                        <form th:action="@{/servers/{id}/update(id=${row.server.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-dark">Actualizar</button>
                        </form>
                        <form th:action="@{/servers/{id}/install(id=${row.server.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-warning" onclick="return confirm('Esto preparara/levantara el servidor usando los datos registrados. ¿Continuar?')">Instalar/crear</button>
                        </form>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/servers/{id}/config(id=${row.server.id})}">Configuración</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/servers/{id}/backups(id=${row.server.id})}">Backups</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/servers/{id}/logs(id=${row.server.id})}">Logs</a>
                        <form th:action="@{/servers/{id}/delete(id=${row.server.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Esto solo quitara el servidor de la lista del panel. ¿Continuar?')">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2 class="h5 mt-4">Actividad reciente</h2>
    <div class="bg-white border rounded-2 overflow-hidden">
        <table class="table table-sm mb-0">
            <thead class="table-light">
            <tr><th>Fecha</th><th>Servidor</th><th>Acción</th><th>Estado</th><th>Usuario</th></tr>
            </thead>
            <tbody>
            <tr th:if="${recentLogs.isEmpty()}"><td colspan="5" class="text-center text-secondary py-4">Sin actividad.</td></tr>
            <tr th:each="log : ${recentLogs}">
                <td th:text="${#temporals.format(log.startedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${log.server.name}"></td>
                <td th:text="${log.action}"></td>
                <td th:text="${log.status}"></td>
                <td th:text="${log.username}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
