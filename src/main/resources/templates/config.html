<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuracion Palworld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white">
    <div class="container-fluid page-shell">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Palworld Admin</a>
    </div>
</nav>
<main class="container-fluid page-shell py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h1 class="h3 mb-1" th:text="'Configuracion - ' + ${view.server.name}"></h1>
            <div class="small text-secondary" th:text="${view.paths.settingsFile}"></div>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/}">Volver</a>
    </div>

    <div th:if="${!view.settingsExists}" class="alert alert-warning">
        PalWorldSettings.ini no existe todavia. Normalmente se genera despues de iniciar el servidor por primera vez.
        <form th:if="${view.defaultSettingsExists}" class="d-inline ms-2" th:action="@{/servers/{id}/config/copy-default(id=${view.server.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-sm btn-warning">Copiar DefaultPalWorldSettings.ini</button>
        </form>
    </div>
    <div th:if="${status.name() == 'RUNNING'}" class="alert alert-info">
        Al guardar, el panel detendra el servidor, escribira PalWorldSettings.ini y lo iniciara nuevamente.
    </div>

    <ul class="nav nav-tabs" id="configTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#form-mode" type="button">Formulario</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#advanced-mode" type="button">Avanzado</button>
        </li>
    </ul>
    <div class="tab-content bg-white border border-top-0 rounded-bottom-2 p-4">
        <section class="tab-pane fade show active" id="form-mode">
            <form th:action="@{/servers/{id}/config/form(id=${view.server.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-6" th:each="field : ${view.fields}">
                        <label class="form-label" th:for="${field.name}" th:text="${field.name}"></label>
                        <input class="form-control" th:id="${field.name}" th:name="${field.name}" th:value="${field.value}">
                    </div>
                </div>
                <button class="btn btn-primary mt-4">Guardar formulario</button>
            </form>
        </section>
        <section class="tab-pane fade" id="advanced-mode">
            <form th:action="@{/servers/{id}/config/advanced(id=${view.server.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <textarea class="form-control config-editor" name="content" rows="22" required th:text="${view.rawContent}"></textarea>
                <button class="btn btn-primary mt-4">Guardar avanzado</button>
            </form>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
