<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Backups Palworld</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white">
    <div class="container-fluid page-shell">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Palworld Admin</a>
    </div>
</nav>
<main class="container-fluid page-shell py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0" th:text="'Backups - ' + ${server.name}"></h1>
        <a class="btn btn-outline-secondary" th:href="@{/}">Volver</a>
    </div>

    <div class="bg-white border rounded-2 overflow-hidden">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Fecha detectada</th>
                <th>Mundo</th>
                <th>Ruta relativa</th>
                <th>Tamaño</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${backups.isEmpty()}"><td colspan="5" class="text-center text-secondary py-5">No se detectaron backups.</td></tr>
            <tr th:each="backup, backupStat : ${backups}">
                <td th:text="${#temporals.format(backup.detectedDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${backup.worldId}"></td>
                <td class="small text-secondary" th:text="${backup.relativePath}"></td>
                <td th:text="${backup.sizeLabel()}"></td>
                <td>
                    <div class="d-flex flex-wrap gap-2 justify-content-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/servers/{id}/backups(id=${server.id}, inspect=${backup.absolutePath})}">Contenido</a>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/servers/{id}/backups/download(id=${server.id}, path=${backup.absolutePath})}">Descargar</a>
                        <button class="btn btn-sm btn-outline-danger" type="button" data-bs-toggle="collapse" th:data-bs-target="'#restore-' + ${backupStat.index}">Restaurar</button>
                    </div>
                    <form class="collapse mt-2" th:id="'restore-' + ${backupStat.index}" th:action="@{/servers/{id}/backups/restore(id=${server.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="path" th:value="${backup.absolutePath}">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-5">
                                <input class="form-control form-control-sm" name="confirmation" placeholder="RESTAURAR" required>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="startAfterRestore" value="true" th:id="'start-' + ${backupStat.index}">
                                    <label class="form-check-label small" th:for="'start-' + ${backupStat.index}">Iniciar al terminar</label>
                                </div>
                            </div>
                            <div class="col-md-3 text-end">
                                <button class="btn btn-sm btn-danger">Confirmar</button>
                            </div>
                        </div>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <section th:if="${contents != null}" class="mt-4">
        <h2 class="h5" th:text="'Contenido - ' + ${inspectPath}"></h2>
        <div class="bg-white border rounded-2 p-3">
            <div class="small text-secondary" th:each="item : ${contents}" th:text="${item}"></div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
