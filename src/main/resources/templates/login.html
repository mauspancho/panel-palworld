<!doctype html>
<html lang="es" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palworld Admin - Login</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-0: #05070c;
            --bg-1: #09111e;
            --card: #0f192a;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #273449;
            --input: #101b2e;
            --primary: #22d3ee;
            --primary-text: #06111a;
            --danger: #fb7185;
            --success: #34d399;
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg-0: #f8fafc;
            --bg-1: #eef6fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #d8e1ec;
            --input: #ffffff;
            --primary: #0891b2;
            --primary-text: #f8fafc;
            --danger: #be123c;
            --success: #047857;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at top left, rgba(34, 211, 238, 0.14), transparent 28rem),
                radial-gradient(circle at 78% 0%, rgba(126, 87, 255, 0.16), transparent 30rem),
                linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-0) 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 2;
            display: flex;
            gap: 0.25rem;
            padding: 0.25rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: color-mix(in srgb, var(--card) 92%, transparent);
        }

        .theme-toggle button,
        .submit {
            border: 0;
            font: inherit;
            cursor: pointer;
        }

        .theme-toggle button {
            height: 2rem;
            border-radius: 0.35rem;
            padding: 0 0.65rem;
            background: transparent;
            color: var(--muted);
        }

        .theme-toggle button[aria-pressed="true"] {
            background: var(--primary);
            color: var(--primary-text);
        }

        .page {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: min(100%, 420px);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: color-mix(in srgb, var(--card) 94%, transparent);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
        }

        .content {
            padding: 1.5rem;
        }

        .icon {
            display: grid;
            width: 3rem;
            height: 3rem;
            margin-bottom: 0.75rem;
            place-items: center;
            border-radius: 0.5rem;
            background: rgba(34, 211, 238, 0.14);
            color: var(--primary);
            border: 1px solid rgba(34, 211, 238, 0.24);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            line-height: 2rem;
        }

        .description {
            margin: 0.25rem 0 1.25rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .alert {
            margin-bottom: 1rem;
            border-radius: 0.45rem;
            padding: 0.75rem;
            font-size: 0.9rem;
        }

        .alert-danger {
            color: var(--danger);
            background: rgba(251, 113, 133, 0.10);
        }

        .alert-success {
            color: var(--success);
            background: rgba(52, 211, 153, 0.10);
        }

        .field {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            height: 2.5rem;
            border: 1px solid var(--border);
            border-radius: 0.45rem;
            background: var(--input);
            color: var(--text);
            font: inherit;
            padding: 0 0.75rem;
        }

        input:focus {
            outline: 2px solid rgba(34, 211, 238, 0.55);
            outline-offset: 2px;
        }

        .submit {
            display: inline-flex;
            width: 100%;
            height: 2.5rem;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 0.45rem;
            background: var(--primary);
            color: var(--primary-text);
            font-weight: 600;
        }
    </style>
    <script>
        (function () {
            var selectedTheme = "dark";
            function systemTheme() {
                return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            function applyTheme(theme) {
                selectedTheme = theme;
                document.documentElement.dataset.theme = theme === "system" ? systemTheme() : theme;
                document.querySelectorAll("[data-theme-option]").forEach(function (button) {
                    button.setAttribute("aria-pressed", String(button.dataset.themeOption === selectedTheme));
                });
            }
            window.setLoginTheme = applyTheme;
            window.addEventListener("DOMContentLoaded", function () {
                applyTheme("dark");
                window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
                    if (selectedTheme === "system") {
                        applyTheme("system");
                    }
                });
            });
        })();
    </script>
</head>
<body>
<div class="theme-toggle" aria-label="Tema visual">
    <button type="button" data-theme-option="system" onclick="window.setLoginTheme('system')">Sistema</button>
    <button type="button" data-theme-option="light" onclick="window.setLoginTheme('light')">Claro</button>
    <button type="button" data-theme-option="dark" onclick="window.setLoginTheme('dark')">Oscuro</button>
</div>
<main class="page">
    <form class="card" th:action="@{/login}" method="post">
        <div class="content">
            <div class="icon" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>
                </svg>
            </div>
            <h1>Palworld Admin</h1>
            <p class="description">Acceso seguro al panel de servidores.</p>
            <div th:if="${param.error}" class="alert alert-danger">Credenciales invalidas.</div>
            <div th:if="${param.logout}" class="alert alert-success">Sesion cerrada.</div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="submit" type="submit">Entrar</button>
        </div>
    </form>
</main>
</body>
</html>
