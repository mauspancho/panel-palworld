<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palworld Admin - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<main class="container d-flex align-items-center justify-content-center min-vh-100">
    <form class="card shadow-sm border-0" th:action="@{/login}" method="post" style="width: min(100%, 420px);">
        <div class="card-body p-4">
            <h1 class="h4 mb-4">Palworld Admin</h1>
            <div th:if="${param.error}" class="alert alert-danger">Credenciales inválidas.</div>
            <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </div>
    </form>
</main>
</body>
</html>
